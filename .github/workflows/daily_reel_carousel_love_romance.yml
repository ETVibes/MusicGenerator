name: Instagram Carousel Love Romance Reel

on:
  # Scheduling is turned off. Run manually: GitHub > Actions > this workflow > Run workflow.
  workflow_dispatch:

jobs:
  run-auto-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Auto Generate & Post Script
        run: |
          SLIDES="${{ github.event.inputs.slides || '4' }}"
          python -m src.auto_generate_and_post --theme "Love and Romance" --mode carousel --type reel --slides "$SLIDES"
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}